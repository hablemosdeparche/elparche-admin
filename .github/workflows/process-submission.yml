name: Process Web Submission (MP)

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: false

jobs:
  create-checkout:
    if: github.event_name == 'issues' && contains(github.event.issue.body, 'mp-status:pending')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create MP Subscription and update issue
        id: create-mp
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        shell: pwsh
        run: |
          $issueBody = '${{ github.event.issue.body }}'
          $issueNum = if ('${{ github.event_name }}' -eq 'issues') { ${{ github.event.issue.number }} } else { 0 }

          if ($issueBody -match 'mp-sub-id:\s*(\S+)') {
            Write-Output "Subscription already exists: $($matches[1])"
            exit 0
          }

          # Extract data
          $nombre = if ($issueBody -match '^## Nuevo registro: (.+)') { $matches[1].Trim() } else { "Venue" }
          $ciudad = if ($issueBody -match '\*\*Ciudad:\*\* (.+)') { $matches[1].Trim() } else { "" }
          $plan = if ($issueBody -match '\*\*Plan:\*\* (.+) \(\$') { $matches[1].Trim() } else { "Presencia Basica" }
          $email = if ($issueBody -match '\*\*Email:\*\* (.+)') { $matches[1].Trim() } else { "" }

          $prices = @{ "Presencia Basica"=30000; "Verificado"=60000; "Destacado"=80000; "Completo"=100000 }
          $amount = if ($prices.ContainsKey($plan)) { $prices[$plan] } else { 30000 }

          $externalRef = "elparche-$issueNum"

          $headers = @{ Authorization = "Bearer $env:MP_ACCESS_TOKEN"; "Content-Type" = "application/json" }
          $subBody = @{
            reason = "$nombre - $plan - $ciudad"
            external_reference = $externalRef
            payer_email = $email
            auto_recurring = @{
              frequency = 1
              frequency_type = "months"
              transaction_amount = $amount
              currency_id = "COP"
              free_trial = @{
                frequency = 1
                frequency_type = "months"
              }
            }
            back_url = "https://hablemosdeparche.github.io/admintaller/mp-success.html"
            status = "pending"
          } | ConvertTo-Json -Depth 10

          try {
            $resp = Invoke-RestMethod -Uri "https://api.mercadopago.com/preapproval" -Headers $headers -Method Post -Body $subBody -ContentType "application/json"

            $subId = $resp.id
            $initPoint = $resp.init_point

            Write-Output "MP Subscription: $subId"
            echo "mp-sub-id=$subId" >> $env:GITHUB_OUTPUT
            echo "mp-init-point=$initPoint" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Output "Error creating MP subscription: $_"
            exit 1
          }

      - name: Update issue with subscription info
        if: steps.create-mp.outputs.mp-sub-id
        uses: actions/github-script@v7
        with:
          script: |
            const subId = '${{ steps.create-mp.outputs.mp-sub-id }}';
            const initPoint = '${{ steps.create-mp.outputs.mp-init-point }}';
            const body = context.payload.issue.body;
            const updatedBody = body + `\nmp-sub-id: ${subId}\nmp-init-point: ${initPoint}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: updatedBody
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `🔗 **Completá tu suscripción en Mercado Pago**\n\n[Hacé clic acá para pagar](${initPoint})\n\n📅 Primer mes gratis — después se cobra automáticamente cada mes.\n\n💳 Podés pagar con tarjeta crédito/débito, PSE, Nequi o Mercado Pago.`
            });

name: Process Confirmed Payment

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue details
        id: issue-data
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.issue_number }}')
            });
            const body = issue.data.body;

            // Parse data from issue body
            const data = {};
            const patterns = {
              ciudad: /\*\*Ciudad:\*\* (.+)/,
              nombre: /^## Nuevo registro: (.+)/m,
              nit: /\*\*NIT:\*\* (.+)/,
              plan: /\*\*Plan:\*\* (.+) \(\$/,
              barrio: /\*\*Barrio:\*\* (.+)/,
              categoria: /\*\*Categoría:\*\* (.+)/,
              telefono: /\*\*Teléfono:\*\* (.+)/,
              instagram: /\*\*Instagram:\*\* (.+)/,
              horario: /\*\*Horario:\*\* (.+)/,
              descripcion: /\*\*Descripción:\*\* (.+)/,
              menu: /\*\*Menú:\*\* (.+)/,
              etiquetas: /\*\*Etiquetas:\*\* (.+)/,
              fotoUrl: /\*\*Foto URL:\*\* (.+)/
            };

            for (const [key, pattern] of Object.entries(patterns)) {
              const match = body.match(pattern);
              data[key] = match ? match[1].trim() : '';
            }

            // Clean up "—" placeholders
            for (const key of Object.keys(data)) {
              if (data[key] === '—') data[key] = '';
            }

            core.setOutput('ciudad', data.ciudad);
            core.setOutput('nombre', data.nombre);
            core.setOutput('nit', data.nit || '');
            core.setOutput('plan', data.plan);
            core.setOutput('barrio', data.barrio);
            core.setOutput('categoria', data.categoria);
            core.setOutput('telefono', data.telefono);
            core.setOutput('instagram', data.instagram);
            core.setOutput('horario', data.horario);
            core.setOutput('descripcion', data.descripcion);
            core.setOutput('menu', data.menu);
            core.setOutput('etiquetas', data.etiquetas);
            core.setOutput('fotoUrl', data.fotoUrl);

            return data;

      - name: Determine city repo slug
        id: city-slug
        shell: pwsh
        run: |
          $ciudad = "${{ steps.issue-data.outputs.ciudad }}"
          $slug = $ciudad.ToLower().Replace(' ', '-').Replace('á','a').Replace('é','e').Replace('í','i').Replace('ó','o').Replace('ú','u').Replace('ñ','n')
          Write-Output "city-slug=$slug" >> $env:GITHUB_OUTPUT

      - name: Validate NIT is not duplicated
        id: validate-nit
        shell: pwsh
        run: |
          $nit = "${{ steps.issue-data.outputs.nit }}".Trim()
          $nombre = "${{ steps.issue-data.outputs.nombre }}".Trim()
          $ciudad = "${{ steps.issue-data.outputs.ciudad }}".Trim()

          if ([string]::IsNullOrWhiteSpace($nit)) {
            Write-Output "NIT no proporcionado — continuando sin validacion"
            echo "nit-valid=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $repoPath = "city-repo"
          if (!(Test-Path $repoPath)) {
            echo "nit-valid=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $indexFile = Join-Path $repoPath "index.html"
          if (!(Test-Path $indexFile)) {
            echo "nit-valid=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $content = Get-Content $indexFile -Raw
          # Buscar si el NIT ya existe en otro venue (distinto nombre)
          $pattern = "nit:'$nit'"
          if ($content -match $pattern) {
            Write-Output "ERROR: El NIT $nit ya esta registrado en $ciudad"
            exit 1
          }

          Write-Output "NIT validado: $nit no existe en $ciudad"
          echo "nit-valid=true" >> $env:GITHUB_OUTPUT

      - name: Checkout city repo
        uses: actions/checkout@v4
        with:
          repository: hablemosdeparche/${{ steps.city-slug.outputs.city-slug }}
          token: ${{ secrets[format('{0}_PAT', steps.city-slug.outputs.city-slug)] }}
          path: city-repo

      - name: Update city HTML
        shell: pwsh
        run: |
          $repoPath = "city-repo"
          $indexFile = Join-Path $repoPath "index.html"
          if (!(Test-Path $indexFile)) {
            Write-Output "No index.html for this city"
            exit 1
          }

          $content = Get-Content $indexFile -Raw

          $nombre = "${{ steps.issue-data.outputs.nombre }}" -replace "'", "\'"
          $barrio = "${{ steps.issue-data.outputs.barrio }}" -replace "'", "\'"
          $categoria = "${{ steps.issue-data.outputs.categoria }}"
          $plan = "${{ steps.issue-data.outputs.plan }}"
          $desc = "${{ steps.issue-data.outputs.descripcion }}" -replace "'", "\'"
          $horario = "${{ steps.issue-data.outputs.horario }}" -replace "'", "\'"
          $telefono = "${{ steps.issue-data.outputs.telefono }}" -replace "'", "\'"
          $instagram = "${{ steps.issue-data.outputs.instagram }}" -replace "'", "\'"
          $menuStr = "${{ steps.issue-data.outputs.menu }}"
          $etiquetas = "${{ steps.issue-data.outputs.etiquetas }}"
          $fotoUrl = "${{ steps.issue-data.outputs.fotoUrl }}"

          # Determine orden based on plan
          $orden = 999
          if ($plan -eq "Destacado") { $orden = 50 }
          if ($plan -eq "Completo") { $orden = 10 }
          if ($plan -eq "Verificado") { $orden = 60 }

          # Parse menu (max 4 for basic)
          $menuArr = @()
          if ($menuStr) {
            $menuArr = $menuStr -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            if ($plan -eq "Presencia Basica" -and $menuArr.Count -gt 4) {
              $menuArr = $menuArr[0..3]
            }
          }
          $menuJsStr = ($menuArr | ForEach-Object { "'$_'" }) -join ","

          # Parse tags
          $tagsArr = @($categoria)
          if ($etiquetas) { $etiquetas -split ',' | ForEach-Object { $t = $_.Trim(); if ($t) { $tagsArr += $t } } }
          $tagsStr = ($tagsArr | ForEach-Object { "'$_'" }) -join ","

          # Determine bg class
          $bgClasses = @{ "bares"="pt1"; "cafe"="pt2"; "comida"="pt3"; "arte"="pt4"; "plan"="pt5"; "noche"="pt6" }
          $bg = if ($bgClasses.ContainsKey($categoria)) { $bgClasses[$categoria] } else { "pt1" }

          # Determine precio tag
          $precioTag = "$$ Promedio"
          if ($plan -eq "Presencia Basica") { $precioTag = "$ Económico" }
          if ($plan -eq "Verificado" -or $plan -eq "Destacado" -or $plan -eq "Completo") { $precioTag = "$$$ Exclusivo" }

          # Check if place already exists
          $pattern = [regex]::Escape("name:'$nombre'")
          $exists = $content -match "\{[^}]*name\s*:\s*'$nombre'[^}]*\}"

          if ($exists) {
            # Update existing
            $match = [regex]::Match($content, "\{[^}]*name\s*:\s*'$nombre'[^}]*\}")
            if ($match.Success) {
              $oldStr = $match.Value
              $newStr = $oldStr

              $newStr = $newStr -replace "orden:\d+", "orden:$orden"
              $newStr = $newStr -replace "barrio:'[^']*'", "barrio:'$barrio'"
              $newStr = $newStr -replace "tags:\[[^\]]*\]", "tags:[$tagsStr]"
              $newStr = $newStr -replace "horario:'[^']*'", "horario:'$horario'"
              $newStr = $newStr -replace "precio:'[^']*'", "precio:'$precioTag'"
              $newStr = $newStr -replace "desc:'[^']*'", "desc:'$desc'"
              $newStr = $newStr -replace "telefono:'[^']*'", "telefono:'$telefono'"
              $newStr = $newStr -replace "instagram:'[^']*'", "instagram:'$instagram'"
              $newStr = $newStr -replace "menu:\[[^\]]*\]", "menu:[$menuJsStr]"

              if ($fotoUrl) { $newStr = $newStr -replace "img:'[^']*'", "img:'$fotoUrl'" }

              $content = $content.Replace($oldStr, $newStr)
              Write-Output "Updated existing venue: $nombre"
            }
          } else {
            # Add new place - get next id
            $idMatch = [regex]::Matches($content, "id\s*:\s*(\d+)")
            $maxId = 0
            foreach ($m in $idMatch) { $id = [int]$m.Groups[1].Value; if ($id -gt $maxId) { $maxId = $id } }
            $nextId = $maxId + 1

            $nit = "${{ steps.issue-data.outputs.nit }}".Trim()
            $newPlace = "  { id:$nextId, orden:$orden, bg:'$bg', cat:'$categoria', name:'$nombre', nit:'$nit', barrio:'$barrio', tags:[$tagsStr], rating:4.5, horario:'$horario', precio:'$precioTag', desc:'$desc', img:'$fotoUrl', telefono:'$telefono', instagram:'$instagram', menu:[$menuJsStr], coords:[10.4240,-75.5510] },"

            $closeMatch = [regex]::Match($content, '\];\s*\n\s*// ═══')
            if ($closeMatch.Success) {
              $insertPos = $closeMatch.Index
              $content = $content.Substring(0, $insertPos) + "`n$newPlace`n" + $content.Substring($insertPos)
              Write-Output "Added new venue: $nombre"
            }
          }

          Set-Content $indexFile $content
          Write-Output "HTML updated for $nombre"

      - name: Commit and push to city repo
        shell: pwsh
        run: |
          Push-Location city-repo
          git config user.name "El Parche Bot"
          git config user.email "bot@elparche.co"
          git add index.html
          git commit -m "Registro pagado: ${{ steps.issue-data.outputs.nombre }} - ${{ steps.issue-data.outputs.plan }} - $(Get-Date -Format 'dd/MM/yyyy')" || Write-Output "Nothing to commit"
          git push || Write-Output "Push failed"
          Pop-Location

      - name: Update venues.json in central repo
        shell: pwsh
        run: |
          $nit = "${{ steps.issue-data.outputs.nit }}".Trim()
          $nombre = "${{ steps.issue-data.outputs.nombre }}".Trim()
          $ciudad = "${{ steps.city-slug.outputs.city-slug }}"
          $telefono = "${{ steps.issue-data.outputs.telefono }}".Trim()
          $jsonPath = "venues.json"

          $venues = @()
          if (Test-Path $jsonPath) {
            $venues = Get-Content $jsonPath -Raw | ConvertFrom-Json
          }

          $existing = $venues | Where-Object { $_.nombre -eq $nombre -and $_.ciudad -eq $ciudad }
          if ($existing) {
            $existing.nit = $nit
            $existing.activo = $true
            if ($telefono) { $existing.telefono = $telefono }
          } else {
            $venues += @{
              nombre = $nombre
              nit = $nit
              ciudad = $ciudad
              telefono = $telefono
              activo = $true
            }
          }

          $venues | ConvertTo-Json -Depth 3 | Set-Content $jsonPath -Encoding UTF8
          Write-Output "venues.json actualizado"

          git config user.name "El Parche Bot"
          git config user.email "bot@elparche.co"
          git add venues.json
          git commit -m "Update venues.json: $nombre - $ciudad" || Write-Output "Nothing to commit"
          git push || Write-Output "Push failed"

      - name: Store MP subscription in billing-db.json
        shell: pwsh
        run: |
          $dbPath = "billing-db.json"
          $db = if (Test-Path $dbPath) { Get-Content $dbPath -Raw -Encoding UTF8 | ConvertFrom-Json } else { @{ payments = @(); venues = @() } }

          $nombre = "${{ steps.issue-data.outputs.nombre }}"
          $ciudad = "${{ steps.city-slug.outputs.city-slug }}"
          $plan = "${{ steps.issue-data.outputs.plan }}"
          $precios = @{ "Presencia Basica"=30000; "Verificado"=60000; "Destacado"=80000; "Completo"=100000 }
          $precio = if ($precios.ContainsKey($plan)) { $precios[$plan] } else { 30000 }

          $existing = $db.venues | Where-Object { $_.Nombre -eq $nombre -and $_.Ciudad -eq $ciudad }
          if ($existing) {
            $existing.activo = $true
            $existing.Estado = "Activo"
            $existing.updatedAt = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          } else {
            $nextId = if ($db.venues.Count -gt 0) { ($db.venues | ForEach-Object { $_.ID } | Measure-Object -Maximum).Maximum + 1 } else { 1 }
            $newVenue = @{
              ID = $nextId
              Nombre = $nombre
              Ciudad = $ciudad
              Plan = $plan
              Precio = "$precio"
              Estado = "Activo"
              activo = $true
              FechaReg = (Get-Date -Format "dd/MM/yyyy")
              updatedAt = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
            }
            $db.venues += $newVenue
          }

          $db | ConvertTo-Json -Depth 10 | Set-Content $dbPath -Encoding UTF8
          Write-Output "billing-db.json actualizado"

          # Commit billing-db.json to central repo
          git config user.name "El Parche Bot"
          git config user.email "bot@elparche.co"
          git add billing-db.json
          git commit -m "MP subscription: $nombre - $ciudad - $(Get-Date -Format 'dd/MM/yyyy')" || Write-Output "Nothing to commit"
          git push || Write-Output "Push failed"

      - name: Update GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ github.event.inputs.issue_number }}');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ **Registro completado exitosamente.** 🎉

        **${{ steps.issue-data.outputs.nombre }}** ya aparece en la guía de **${{ steps.issue-data.outputs.ciudad }}** con el plan **${{ steps.issue-data.outputs.plan }}**.

        📅 Primer mes gratis.
        💰 Se renovará automáticamente cada mes vía Mercado Pago.

        Si necesitás editar algo, respondé a este issue o escribinos por WhatsApp.`
            });

name: Deploy Pages
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Replace token in frontend
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $file = "admintaller/index.html"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $content = $content -replace "'\{\{GITHUB_PAT}}'", "'$env:GH_PAT'"
            Set-Content $file $content -Encoding UTF8 -NoNewline
            Write-Output "Token inyectado en admintaller/index.html"
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
